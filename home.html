<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container home">

    <h1>Welcome!</h1>

    <p id="userInfo">Loading user information...</p>

    <hr>

    <h2>Users</h2>

    <button onclick="loadUsers()">View Users</button>

    <div id="usersList"></div>

    <hr>

    <h2>Add User</h2>

    <form id="addUserForm">

        <label>Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Add User</button>

    </form>

    <p id="message"></p>

    <p>
        <a href="/login.html" onclick="logout()">Back to Login</a>
    </p>

</div>

<script>

let currentRole = null;


// Load logged-in user
async function loadCurrentUser() {

    const response = await fetch("/users/me");

    if (!response.ok) {
        window.location.href = "/login.html";
        return;
    }

    const user = await response.json();

    currentRole = user.role;

    document.getElementById("userInfo").innerHTML =
        "Logged in as: <strong>" +
        user.email +
        "</strong><br>Role: <strong>" +
        user.role +
        "</strong>";
}


// Load users
async function loadUsers() {

    const response = await fetch("/users");

    if (!response.ok) {
        document.getElementById("usersList").innerHTML =
            "<p>Please login first.</p>";
        return;
    }

    const users = await response.json();

    let html = `
        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                ${currentRole === "ADMIN" ? "<th>Action</th>" : ""}
            </tr>
    `;

    users.forEach(user => {

        html += `
            <tr>
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>${user.role}</td>
                ${
                    currentRole === "ADMIN"
                    ?
                    `<td>
                        <button onclick="deleteUser(${user.id})">
                            Delete
                        </button>
                    </td>`
                    :
                    ""
                }
            </tr>
        `;
    });

    html += "</table>";

    document.getElementById("usersList").innerHTML = html;
}


// Add user
document.getElementById("addUserForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const user = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        const response = await fetch("/users/add", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(user)
        });

        const result = await response.text();

        document.getElementById("message").textContent = result;

        if (response.ok) {
            document.getElementById("addUserForm").reset();
            loadUsers();
        }
    }
);


// Delete user
async function deleteUser(id) {

    if (currentRole !== "ADMIN") {
        return;
    }

    const confirmDelete =
        confirm("Are you sure you want to delete this user?");

    if (!confirmDelete) {
        return;
    }

    const response = await fetch("/users/" + id, {
        method: "DELETE"
    });

    const result = await response.text();

    document.getElementById("message").textContent = result;

    loadUsers();
}


// Logout
function logout() {

    // Session will expire naturally.
    // Login page is opened after clicking the link.
}


// Load user information when page opens
loadCurrentUser();

</script>

</body>
</html>
